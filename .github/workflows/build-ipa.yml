name: Build DeskMini IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar o build manualmente pelo botão no GitHub

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar App iOS (xcodebuild)
        run: |
          xcodebuild -project DeskMini.xcodeproj \
            -scheme DeskMini \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/DeskMini.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar IPA para TrollStore
        run: |
          mkdir -p Payload
          cp -r build/DeskMini.xcarchive/Products/Applications/DeskMini.app Payload/
          
          # Assinatura ad-hoc (necessária para validação básica no TrollStore)
          codesign -s - --force --deep Payload/DeskMini.app
          
          # Compactar em formato .ipa
          zip -r DeskMini.ipa Payload

      - name: Salvar IPA como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: DeskMini-TrollStore-IPA
          path: DeskMini.ipa
          retention-days: 14
